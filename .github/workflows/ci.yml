name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: newsbot
          POSTGRES_PASSWORD: test
          POSTGRES_DB: newsbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U newsbot -d newsbot_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          NEWSBOT_TEST_DATABASE_URL: postgres://newsbot:test@localhost:5432/newsbot_test?sslmode=disable
          NEWSBOT_RENDER_TEST: '1'
      - run: go build ./cmd/newsbot
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run typecheck
      - run: npm run test:integration
